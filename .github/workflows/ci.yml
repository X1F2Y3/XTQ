name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check src
        continue-on-error: true

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src

      - name: Smoke — Mock mode boots
        run: |
          set -e
          timeout 20 python src/main.py --mock > /tmp/tdf.log 2>&1 || true
          echo "----- first 25 log lines -----"
          head -n 25 /tmp/tdf.log
          grep -q "思维动态场" /tmp/tdf.log

      - name: Test (tests/ is planned — see README roadmap)
        run: |
          if [ -d tests ] && [ -n "$(ls -A tests 2>/dev/null)" ]; then
            pytest -q
          else
            echo "::notice::tests/ not present yet (planned — see README 路线图)"
          fi
