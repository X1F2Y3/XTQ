name: Bug report
description: Mock 链路报错、崩溃，或记忆 / 触发行为不符合预期
title: "[bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，期望是什么。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现
      description: 命令 + 日志（`python src/main.py --mock` 的输出）。
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: py
    attributes:
      label: Python 版本
      description: "`python -V`"
    validations:
      required: true
